<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Order Allocation Manager — interactive demo</title>
<style>
/* ============================================================
   Demo shell. The whole demo (Manage Orders -> Allocation Manager) runs inside the frame.
   Screen size is chosen in pure CSS: radio buttons + :has() set the frame size, and the pages
   inside lay themselves out with CSS media queries against that size. JS only handles fitting
   the frame to your window, remembering your choices, and passing the test switches to the page.
   ============================================================ */
:root { --s: 1; }
* { box-sizing: border-box; }
body {
    margin: 0; background: #e9ecf1; color: #1b1b1b;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    /* screen size (width x height) for each option; --w/--h are what the frame uses */
    --bw: 1920px; --bh: 1080px; --bz: 10px; --br: 14px;
    /* natural size of each option is --bw x --bh; orientation decides which side runs across */
    --w: max(var(--bw), var(--bh)); --h: min(var(--bw), var(--bh));
}
body:has(#sz-qhd:checked)  { --bw: 2560px; --bh: 1440px; }
body:has(#sz-4k:checked)   { --bw: 3840px; --bh: 2160px; }
body:has(#sz-tab:checked)  { --bw: 834px;  --bh: 1194px; --bz: 14px; --br: 38px; }   /* iPad Pro 11" */
body:has(#sz-ph:checked)   { --bw: 390px;  --bh: 844px;  --bz: 12px; --br: 40px; }   /* iPhone 14 */
body:has(#sz-sph:checked)  { --bw: 360px;  --bh: 800px;  --bz: 12px; --br: 40px; }   /* small Android */
/* portrait puts the long side vertical, for any size (a tablet, a phone, even a vertical monitor) */
body:has(#o-portrait:checked) { --w: min(var(--bw), var(--bh)); --h: max(var(--bw), var(--bh)); }

/* ---------- control bar ---------- */
.bar { position: sticky; top: 0; z-index: 10; background: #032d60; color: #fff; padding: .5rem 1rem; font-size: 13px; display: flex; flex-wrap: wrap; align-items: center; gap: .4rem 1.25rem; }
.bar .group { display: inline-flex; align-items: center; gap: .5rem; }
.bar label { display: inline-flex; align-items: center; gap: .35rem; cursor: pointer; }
.bar select { font-size: 13px; padding: .1rem .3rem; color: #1b1b1b; background: #fff; border: 0; border-radius: 3px; }
.seg { display: inline-flex; border: 1px solid #5a7fb0; border-radius: 4px; overflow: hidden; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label, .seg button { padding: .25rem .7rem; cursor: pointer; white-space: nowrap; background: transparent; color: #fff; border: 0; font: inherit; }
.seg input:checked + label, .seg button.on { background: #fff; color: #032d60; font-weight: 600; }
.seg input:focus-visible + label { outline: 2px solid #fff; outline-offset: -2px; }
.seg label small { opacity: .7; margin-left: .25rem; font-weight: 400; }
.keys { opacity: .65; font-size: 12px; }
.keys kbd { font: inherit; border: 1px solid #5a7fb0; border-radius: 3px; padding: 0 .3rem; }
.ctl { display: none; align-items: center; gap: .75rem; padding-left: 1.25rem; border-left: 1px solid #3d63a0; }
body[data-page="orders"] .ctl-orders, body[data-page="manager"] .ctl-manager, body[data-page="shipments"] .ctl-shipments { display: inline-flex; }
#readout { margin-left: auto; opacity: .85; }

/* ---------- stage and frame ---------- */
.stage { position: relative; overflow: auto; padding: 16px; }
.frame {
    box-sizing: content-box; width: var(--w); height: var(--h); padding: var(--bz);
    margin: 0 auto; background: #1b1b1b; border-radius: var(--br); box-shadow: 0 8px 24px rgba(0,0,0,.25);
}
body:has(#fit:checked) .stage { overflow: hidden; }
body:has(#fit:checked) .frame { position: absolute; left: 50%; top: 16px; margin: 0; transform-origin: top center; transform: translateX(-50%) scale(var(--s)); }
.frame iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; border-radius: max(2px, calc(var(--br) - var(--bz) + 2px)); }
</style>
</head>
<body data-page="orders">

<div class="bar" id="bar">
    <span class="group"><strong>Demo</strong> static mock data</span>

    <span class="group">Screen
        <span class="seg" role="radiogroup" aria-label="Screen size">
            <input type="radio" name="sz" id="sz-1080" checked><label for="sz-1080">1080p<small>1920×1080</small></label>
            <input type="radio" name="sz" id="sz-qhd"><label for="sz-qhd">1440p<small>2560×1440</small></label>
            <input type="radio" name="sz" id="sz-4k"><label for="sz-4k">4K<small>3840×2160</small></label>
            <input type="radio" name="sz" id="sz-tab" class="dev-size"><label for="sz-tab">Tablet<small>834×1194</small></label>
            <input type="radio" name="sz" id="sz-ph" class="dev-size"><label for="sz-ph">Phone<small>390×844</small></label>
            <input type="radio" name="sz" id="sz-sph" class="dev-size"><label for="sz-sph">Small phone<small>360×800</small></label>
        </span>
    </span>
    <span class="group">Orientation
        <span class="seg" role="radiogroup" aria-label="Orientation">
            <input type="radio" name="or" id="o-landscape" checked><label for="o-landscape">▭ Landscape</label>
            <input type="radio" name="or" id="o-portrait"><label for="o-portrait">▯ Portrait</label>
        </span>
    </span>
    <label><input type="checkbox" id="fit" checked> Fit to window <span id="scale"></span></label>
    <span class="keys" title="Keyboard shortcuts"><kbd>1</kbd>–<kbd>6</kbd> size · <kbd>R</kbd> rotate · <kbd>F</kbd> fit</span>

    <span class="seg" id="pages" aria-label="Page">
        <button type="button" data-page="orders" class="on">1 · Manage Orders</button>
        <button type="button" data-page="manager">2 · Allocation Manager</button>
        <button type="button" data-page="shipments">3 · Shipment Status</button>
    </span>

    <span class="ctl ctl-orders">
        <label>displayMode
            <select id="ctl-displayMode"><option>Card</option><option>Table</option></select>
        </label>
    </span>
    <span class="ctl ctl-manager">
        <label><input type="checkbox" id="ctl-lock"> Amplify lock (read-only)</label>
        <select id="ctl-reason" aria-label="Lock reason"><option>Return in progress</option><option>Adjustment in progress</option></select>
        <label><input type="checkbox" id="ctl-confirm"> Confirm all allocations</label>
    </span>

    <span class="ctl ctl-shipments">
        <label>Version
            <select id="ctl-ssVersion"><option value="new">New · first pass</option><option value="existing">Existing</option></select>
        </label>
        <label>Flow outcome
            <select id="ctl-flow"><option value="ok">Order found</option><option value="invalid">Order not found</option><option value="error">Error</option></select>
        </label>
    </span>

    <span id="readout" aria-live="polite"></span>
</div>

<div class="stage" id="stage">
    <div class="frame" id="frame"><iframe id="app" title="Order Allocation Manager demo" src="orders.html"></iframe></div>
</div>

<script>
const $ = id => document.getElementById(id);
const PAGES = { orders: 'orders.html', manager: 'manager.html', shipments: 'shipment-status.html' };
const app = $('app'), frame = $('frame'), stage = $('stage'), bar = $('bar');
const ctl = { displayMode: 'Card', lock: false, lockReason: 'Return in progress', confirmAll: false, ssVersion: 'new', flowOutcome: 'ok' };
let page = 'orders';

// ---- remember choices for this browser tab ----
const KEY = 'oam-demo';
const saved = (() => { try { return JSON.parse(sessionStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
const save = () => { try { sessionStorage.setItem(KEY, JSON.stringify({ sz: document.querySelector('input[name=sz]:checked').id, or: document.querySelector('input[name=or]:checked').id, lastOrient, fit: $('fit').checked, ctl })); } catch (e) {} };
// Orientation is remembered separately for desktop-size screens and for tablet/phone sizes, so moving between
// the two groups restores how you last held each one (desktops default to landscape, devices to portrait).
const groupOf = id => $(id).classList.contains('dev-size') ? 'device' : 'desktop';
const lastOrient = Object.assign({ desktop: 'o-landscape', device: 'o-portrait' }, saved.lastOrient || {});
if (saved.sz && $(saved.sz)) $(saved.sz).checked = true;
let curGroup = groupOf(document.querySelector('input[name=sz]:checked').id);
$(saved.or && $(saved.or) ? saved.or : lastOrient[curGroup]).checked = true;
if (typeof saved.fit === 'boolean') $('fit').checked = saved.fit;
Object.assign(ctl, saved.ctl || {});
$('ctl-displayMode').value = ctl.displayMode; $('ctl-lock').checked = ctl.lock; $('ctl-reason').value = ctl.lockReason; $('ctl-confirm').checked = ctl.confirmAll; $('ctl-ssVersion').value = ctl.ssVersion; $('ctl-flow').value = ctl.flowOutcome;

// ---- fit the frame to the window (the frame itself keeps its true CSS-pixel size) ----
function fit() {
    frame.style.removeProperty('--s'); stage.style.height = ''; $('scale').textContent = '';
    if (!$('fit').checked) return;
    const w = frame.offsetWidth, h = frame.offsetHeight;
    const s = Math.min(1, (stage.clientWidth - 32) / w, (window.innerHeight - bar.offsetHeight - 32) / h);
    frame.style.setProperty('--s', s); stage.style.height = Math.ceil(h * s + 32) + 'px';
    $('scale').textContent = '(' + Math.round(s * 100) + '%)';
}
window.addEventListener('resize', fit);
const ask = () => setTimeout(() => app.contentWindow && app.contentWindow.postMessage({ src: 'oam-shell', type: 'query' }, '*'), 120);   // the page reports back which layout it chose
window.addEventListener('resize', ask);
document.addEventListener('change', e => {
    if (e.target.matches('input[name=sz]')) {                                   // moving between desktop sizes and device sizes
        const g = groupOf(e.target.id);
        if (g !== curGroup) { curGroup = g; $(lastOrient[g]).checked = true; }
    }
    if (e.target.matches('input[name=or]')) lastOrient[curGroup] = e.target.id;
    if (e.target.matches('input[name=sz], input[name=or], #fit')) { fit(); save(); ask(); }
});

// ---- keyboard shortcuts: 1-6 pick a size, R flips orientation, F toggles fit ----
const SIZE_IDS = ['sz-1080', 'sz-qhd', 'sz-4k', 'sz-tab', 'sz-ph', 'sz-sph'];
document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey || (e.target.closest && e.target.closest('select, textarea, input[type=text], input[type=search], input[type=number]'))) return;
    const k = e.key.toLowerCase();
    if (k >= '1' && k <= '6') $(SIZE_IDS[+k - 1]).click();
    else if (k === 'r') $(document.querySelector('input[name=or]:checked').id === 'o-landscape' ? 'o-portrait' : 'o-landscape').click();
    else if (k === 'f') $('fit').click();
});

// ---- navigation inside the frame ----
function go(p) { page = p; app.src = PAGES[p]; }
$('pages').addEventListener('click', e => { const b = e.target.closest('button[data-page]'); if (b) go(b.dataset.page); });
const startPage = new URLSearchParams(location.search).get('page');
if (startPage && PAGES[startPage]) go(startPage);

// ---- test switches live in the bar; the page inside the frame receives them ----
const send = (key, value) => app.contentWindow && app.contentWindow.postMessage({ src: 'oam-shell', type: 'set', key, value }, '*');
const replay = p => {
    if (p === 'orders') send('displayMode', ctl.displayMode);
    else if (p === 'shipments') { send('ssVersion', ctl.ssVersion); send('flowOutcome', ctl.flowOutcome); }
    else { send('lock', ctl.lock); send('lockReason', ctl.lockReason); send('confirmAll', ctl.confirmAll); }
};
$('ctl-displayMode').addEventListener('change', e => { ctl.displayMode = e.target.value; send('displayMode', ctl.displayMode); save(); ask(); });
$('ctl-lock').addEventListener('change', e => { ctl.lock = e.target.checked; send('lock', ctl.lock); save(); });
$('ctl-reason').addEventListener('change', e => { ctl.lockReason = e.target.value; send('lockReason', ctl.lockReason); save(); });
$('ctl-confirm').addEventListener('change', e => { ctl.confirmAll = e.target.checked; send('confirmAll', ctl.confirmAll); save(); });
$('ctl-ssVersion').addEventListener('change', e => { ctl.ssVersion = e.target.value; send('ssVersion', ctl.ssVersion); save(); ask(); });
$('ctl-flow').addEventListener('change', e => { ctl.flowOutcome = e.target.value; send('flowOutcome', ctl.flowOutcome); save(); ask(); });

window.addEventListener('message', e => {
    const m = e.data; if (!m || m.src !== 'oam' || e.source !== app.contentWindow) return;
    if (m.type === 'ready') {
        page = m.page; document.body.dataset.page = page;
        document.querySelectorAll('#pages button').forEach(b => b.classList.toggle('on', b.dataset.page === page));
        replay(page);
    }
    if (m.type === 'layout') {
        $('readout').textContent = m.w + '×' + m.h + ' ' + (m.w >= m.h ? 'landscape' : 'portrait') + ' · ' + m.view + (m.w > 1440 ? ' · content capped at 1440' : '');
    }
});
fit();
</script>
</body>
</html>
